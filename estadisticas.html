<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medi-Turnos | Estadísticas y Reportes</title>
<!-- Librería Chart.js para gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --red: #dc2626;
  --red-dark: #b91c1c;
  --red-light: #fef2f2;
  --red-mid: #fecaca;
  --red-soft: #fff5f5;
  --border: #f5c2c2;
  --text: #1a1a1a;
  --text-soft: #6b5a5a;
}
body, html {
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--red-soft);
  color: var(--text);
}
.topbar-prof {
  position: sticky !important;
  top: 0 !important;
  z-index: 999 !important;
  background-color: #ffffff !important;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08) !important;
  border-bottom: 1px solid var(--border) !important;
  margin-bottom: 20px !important;
  padding: 15px 24px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}
.logo-box img {
  height: 40px;
  object-fit: contain;
}
.admin-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin: 0;
}
.quick-access {
  display: flex;
  gap: 8px;
  margin-left: auto;
  margin-right: 12px;
  flex-wrap: wrap;
}
.quick-access button {
  background: #ffffff;
  border: 1px solid var(--border);
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s;
  text-transform: uppercase;
}
.quick-access button:hover,
.quick-access button.active-quick {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}
.doctor-box {
  display: flex;
  align-items: center;
  gap: 10px;
}
.doctor-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #fee2e2;
  color: #750419;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}
.doctor-box div {
  font-size: 13px;
  line-height: 1.2;
}
.doctor-box small {
  color: var(--text-soft);
  font-size: 11px;
}

.container { padding: 0 24px 24px; max-width: 1300px; margin: auto; }
.hc-card {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.stats-grid-4x2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
.stats-grid-4x1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
@media (max-width: 992px) { .stats-grid-4x2, .stats-grid-4x1 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 576px) { .stats-grid-4x2, .stats-grid-4x1 { grid-template-columns: 1fr; } }

.stat-card-item {
  background: #ffffff; border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 10px; text-align: center; display: flex; flex-direction: column;
  align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}
.stat-icon-circle {
  width: 44px; height: 44px; border-radius: 50%; background: var(--red-light);
  border: 1px solid var(--red-mid); display: flex; align-items: center;
  justify-content: center; margin-bottom: 8px; font-size: 18px;
}
.stat-icon-circle img { width: 22px; height: 22px; object-fit: contain; }
.stat-card-item span { font-size: 11px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; margin-bottom: 6px; }
.stat-card-item strong { font-size: 20px; font-weight: 800; color: var(--red); }

.data-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; border-radius: 8px; overflow: hidden; }
.data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0e5e5; font-size: 13px; }
.data-table th { background: var(--red-light); color: var(--red); font-weight: 700; }

.filter-date-group { display: flex; align-items: center; gap: 8px; background: #fff; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
.filter-date-group label { font-size: 12px; font-weight: 700; color: var(--red); }
.filter-date-group input, .filter-date-group select { border: 1px solid #fecaca; border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; }

.table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.pagination-box { display: flex; align-items: center; gap: 10px; margin-top: 15px; font-size: 13px; color: var(--text-soft); justify-content: flex-end; }
.pagination-box button { background: #fff; border: 1px solid var(--border); color: var(--red); padding: 5px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.pagination-box button:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-action { padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; margin-right: 2px; }
.btn-ver { background: #e0f2fe; color: #0369a1; }
.btn-finish { background: #d1fae5; color: #065f46; }
.btn-modificar { background: #fef3c7; color: #92400e; }

.fecha-grupo-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
.fecha-grupo-header { background: var(--red-light); color: var(--red); padding: 10px 15px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

.obras-main-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; margin-top: 15px; }
.charts-column { display: flex; flex-direction: column; gap: 15px; width: 300px; flex-shrink: 0; }
.chart-box-small { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); display: flex; justify-content: center; align-items: center; }
.table-column { flex: 1; min-width: 320px; }
.total-card-box {
  background: var(--red-light); border: 1px solid var(--red-mid); border-radius: 10px;
  padding: 12px 18px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center;
}
.total-card-box span { font-size: 13px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; }
.total-card-box strong { font-size: 18px; font-weight: 800; color: var(--red); }
</style>
</head>
<body>

<header class="topbar-prof">
  <div class="logo-box">
    <img src="assets/Logo-MediTurnos.png" alt="Medi-Turnos" onerror="this.src='https://via.placeholder.com/150x50?text=Medi-Turnos'">
  </div>
  <div>
    <h1 class="admin-title">Estadísticas</h1>
  </div>
  <div class="quick-access">
    <button class="active-quick" onclick="cambiarSeccion('general', this)">Estadísticas generales</button>
    <button onclick="cambiarSeccion('historial', this)">Historial de turnos</button>
    <button onclick="cambiarSeccion('obras', this)">Est. Obra Social/Particular</button>
    <button onclick="window.location.href='secretaria.html'">Volver a administración</button>
  </div>
  <div class="doctor-box">
    <div class="doctor-avatar">SC</div>
    <div><strong>Secretaría</strong><small>Administración · Consultorio</small></div>
  </div>
</header>

<main class="container">
  <div class="hc-card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding: 15px 20px;">
    <div class="filter-date-group">
      <label>Período:</label>
      <input type="date" id="filtroDesde" onchange="actualizarDatos()">
      <span>a</span>
      <input type="date" id="filtroHasta" onchange="actualizarDatos()">

      <label style="margin-left:12px;">Obra Social:</label>
      <select id="selectFiltroObraSocial" onchange="actualizarDatos()">
        <option value="todas">Todas</option>
        <option value="Osde">Osde</option>
        <option value="Swiss Medical">Swiss Medical</option>
        <option value="Particular">Particular / Partic.</option>
      </select>
    </div>
    <div style="font-size:13px; color:var(--text-soft); font-weight:600;">
      📅 Sincronizado con Base de Datos
    </div>
  </div>

  <!-- SECCIÓN 1: ESTADÍSTICAS GENERALES -->
  <section id="sec-general" class="seccion-contenido">
    <div class="hc-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h3 style="color:var(--red); margin:0; letter-spacing:0.5px; font-size:16px; text-transform:uppercase;">ESTADÍSTICAS GENERALES</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-action btn-finish" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-action btn-ver" onclick="alert('Seleccione Guardar como PDF en la ventana de impresión.')">📥 Descargar PDF</button>
          <button class="btn-action btn-modificar" onclick="enviarPorMailGeneral()">✉️ Enviar por Mail</button>
        </div>
      </div>
      <div id="areaEstadisticasGeneralesInner" class="stats-grid-4x2"></div>
    </div>

    <div class="hc-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h3 style="color:var(--red); margin:0; font-size:16px; text-transform:uppercase;">Listado de Consultas Agrupadas por Fecha</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-action btn-finish" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-action btn-ver" onclick="alert('Seleccione Guardar como PDF en la ventana de impresión.')">📥 Descargar PDF</button>
          <button class="btn-action btn-modificar" onclick="enviarPorMailListadoConsultas()">✉️ Enviar por Mail</button>
        </div>
      </div>

      <div class="table-controls">
        <div class="filter-date-group">
          <label>Buscar:</label>
          <input type="text" id="inputBusquedaConsultas" placeholder="Paciente..." oninput="paginaActual=1; renderizarTablaPaginada()" style="width: 140px;">
          <label style="margin-left:4px;">Asistencia:</label>
          <select id="selectFiltroAsistencia" onchange="paginaActual=1; renderizarTablaPaginada()">
            <option value="todos">Todos</option>
            <option value="si">Sí (Atendido)</option>
            <option value="no">No (Pendiente)</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <label style="margin-left:4px;">Ordenar:</label>
          <select id="selectOrdenamiento" onchange="paginaActual=1; renderizarTablaPaginada()">
            <option value="fecha_asc">Fecha (Antigua a Nueva)</option>
            <option value="fecha_desc">Fecha (Nueva a Antigua)</option>
          </select>
        </div>
        <div class="filter-date-group">
          <label>Mostrar:</label>
          <select id="selectPageSize" onchange="paginaActual=1; renderizarTablaPaginada()">
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span style="font-size:12px; font-weight:700; color:var(--red);">reg.</span>
        </div>
      </div>

      <div id="tablaConsultasBox"></div>
      <div class="pagination-box" id="paginacionContainer"></div>
    </div>
  </section>

  <!-- SECCIÓN 2: HISTORIAL DE TURNOS -->
  <section id="sec-historial" class="seccion-contenido" style="display:none;">
    <div class="hc-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h3 style="color:var(--red); margin:0;">Reporte Completo de Turnos</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-action btn-finish" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-action btn-ver" onclick="alert('Seleccione Guardar como PDF en la ventana de impresión.')">📥 Descargar PDF</button>
          <button class="btn-action btn-modificar" onclick="enviarPorMailHistorialTurnos()">✉️ Enviar por Mail</button>
        </div>
      </div>

      <div id="areaHistorialResumen" class="stats-grid-4x1" style="margin-bottom: 20px;"></div>

      <div class="table-controls">
        <div class="filter-date-group">
          <label>Buscar:</label>
          <input type="text" id="inputBusquedaHistorial" placeholder="Paciente..." oninput="paginaActualHistorial=1; renderizarTablaHistorialPaginada()" style="width: 140px;">
          <label style="margin-left:4px;">Asistencia:</label>
          <select id="selectFiltroAsistenciaHistorial" onchange="paginaActualHistorial=1; renderizarTablaHistorialPaginada()">
            <option value="todos">Todos</option>
            <option value="si">Sí (Atendido)</option>
            <option value="no">No (Pendiente)</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <label style="margin-left:4px;">Ordenar:</label>
          <select id="selectOrdenamientoHistorial" onchange="paginaActualHistorial=1; renderizarTablaHistorialPaginada()">
            <option value="fecha_asc">Fecha (Antigua a Nueva)</option>
            <option value="fecha_desc">Fecha (Nueva a Antigua)</option>
          </select>
        </div>
        <div class="filter-date-group">
          <label>Mostrar:</label>
          <select id="selectPageSizeHistorial" onchange="paginaActualHistorial=1; renderizarTablaHistorialPaginada()">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span style="font-size:12px; font-weight:700; color:var(--red);">reg.</span>
        </div>
      </div>

      <div id="tablaHistorialBox"></div>
      <div class="pagination-box" id="paginacionHistorialContainer"></div>
    </div>
  </section>

  <!-- SECCIÓN 3: ESTADÍSTICAS DE OBRA SOCIAL / PARTICULAR -->
  <section id="sec-obras" class="seccion-contenido" style="display:none;">
    <div class="hc-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h3 style="color:var(--red); margin:0;" id="tituloObrasHeader">Estadísticas: Obra Social / Particular</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-action btn-finish" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-action btn-ver" onclick="alert('Seleccione Guardar como PDF en la ventana de impresión.')">📥 Descargar PDF</button>
          <button class="btn-action btn-modificar" onclick="enviarPorMailObras()">✉️ Enviar por Mail</button>
        </div>
      </div>
      
      <div class="obras-main-layout">
        <div class="charts-column">
          <div class="chart-box-small">
            <canvas id="chartTopObras" width="200" height="200"></canvas>
          </div>
          <div class="chart-box-small">
            <canvas id="chartOsVsPart" width="200" height="200"></canvas>
          </div>
        </div>
        <div class="table-column" id="reporteObrasInnerContainer"></div>
      </div>
    </div>
  </section>
</main>

<script>
  window.listaTurnosGeneral = [];

  let paginaActual = 1;
  let paginaActualHistorial = 1;
  let paginaActualObras = 1;
  let turnosFiltradosCache = [];
  let turnosHistorialFiltradosCache = [];
  let coberturasCache = [];
  let chartTopObrasInstance = null;
  let chartOsVsPartInstance = null;

  async function cargarDatosServidor() {
    try {
      const response = await fetch('http://localhost:3000/api/datos');
      const data = await response.json();
      window.listaTurnosGeneral = data.turnos || [];

      const hoy = new Date();
      const haceUnMes = new Date();
      haceUnMes.setMonth(hoy.getMonth() - 1);
      
      if (!document.getElementById('filtroDesde').value) {
        document.getElementById('filtroDesde').value = haceUnMes.toISOString().split('T')[0];
      }
      if (!document.getElementById('filtroHasta').value) {
        document.getElementById('filtroHasta').value = hoy.toISOString().split('T')[0];
      }
      actualizarDatos();
    } catch (error) {
      console.error("Error al conectar con el servidor backend:", error);
    }
  }

  window.onload = () => {
    cargarDatosServidor();
  };

  function cambiarSeccion(seccionId, btnElement) {
    document.querySelectorAll('.seccion-contenido').forEach(el => el.style.display = 'none');
    document.getElementById('sec-' + seccionId).style.display = 'block';
    document.querySelectorAll('.quick-access button').forEach(b => b.classList.remove('active-quick'));
    if (btnElement) btnElement.classList.add('active-quick');
    actualizarDatos();
  }

  function formatearFechaDDMMAA(fechaStr) {
    if (!fechaStr) return '-';
    const partes = fechaStr.split('-');
    if (partes.length !== 3) return fechaStr;
    const anioCorto = partes[0].slice(-2);
    return `${partes[2]}-${partes[1]}-${anioCorto}`;
  }

  function actualizarDatos() {
    const desde = document.getElementById('filtroDesde').value;
    const hasta = document.getElementById('filtroHasta').value;
    const obraSocialFiltro = document.getElementById('selectFiltroObraSocial').value;

    let turnos = window.listaTurnosGeneral.filter(t => t.fecha >= desde && t.fecha <= hasta);

    if (obraSocialFiltro !== 'todas') {
      turnos = turnos.filter(t => {
        let os = (t.obra || 'Particular').toLowerCase();
        if (os.includes('partic')) os = 'particular';
        let buscada = obraSocialFiltro.toLowerCase();
        if (buscada.includes('partic')) buscada = 'particular';
        return os === buscada;
      });
    }
    
    renderGeneralStats4x2(turnos);
    turnosHistorialFiltradosCache = turnos;
    renderizarTablaHistorialPaginada();
    renderReporteObrasYGraficos(turnos, desde, hasta);
  }

  function renderGeneralStats4x2(turnos) {
    const totalTurnos = turnos.length;
    const turnosAsistidos = turnos.filter(t => t.estado.toLowerCase() === 'atendido' || t.estado.toLowerCase() === 'finalizado').length;
    const turnosNoAsistidos = turnos.filter(t => t.estado.toLowerCase() === 'pendiente').length;
    const turnosCancelados = turnos.filter(t => t.estado.toLowerCase() === 'cancelado').length;
    
    let appCount = 0; let whatsCount = 0; let telCount = 0;
    turnos.forEach(t => {
      let m = (t.medioSolicitud || '').toLowerCase();
      if(m.includes('app') || m.includes('web') || m.includes('medi')) appCount++;
      else if(m.includes('what') || m.includes('whats')) whatsCount++;
      else telCount++;
    });

    const tasaAsistencia = totalTurnos > 0 ? Math.round((turnosAsistidos / totalTurnos) * 100) : 0;

    document.getElementById('areaEstadisticasGeneralesInner').innerHTML = `
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#d1fae5; color:#065f46;">✅</div>
        <span>Turnos asistidos</span><strong>${turnosAsistidos}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#fee2e2; color:#991b1b;">⏳</div>
        <span>Turnos no asistidos</span><strong>${turnosNoAsistidos}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#fef3c7; color:#92400e;">❌</div>
        <span>Turnos cancelados</span><strong>${turnosCancelados}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle">📈</div>
        <span>Tasa de asistencia</span><strong>${tasaAsistencia}%</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle">📋</div>
        <span>Total registros</span><strong>${totalTurnos}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle"><img src="assets/Logo-MediTurnos.png" alt="App" onerror="this.parentElement.innerHTML='📱'"></div>
        <span>Por APP</span><strong>${appCount}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle">💬</div>
        <span>Por Whatsapp</span><strong>${whatsCount}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle">📞</div>
        <span>Teléfono / Otros</span><strong>${telCount}</strong>
      </div>
    `;

    document.getElementById('areaHistorialResumen').innerHTML = `
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#d1fae5; color:#065f46;">✅</div>
        <span>Turnos asistidos</span><strong>${turnosAsistidos}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#fee2e2; color:#991b1b;">⏳</div>
        <span>Turnos no asistidos</span><strong>${turnosNoAsistidos}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle" style="background:#fef3c7; color:#92400e;">❌</div>
        <span>Turnos cancelados</span><strong>${turnosCancelados}</strong>
      </div>
      <div class="stat-card-item">
        <div class="stat-icon-circle">📈</div>
        <span>Tasa de asistencia</span><strong>${tasaAsistencia}%</strong>
      </div>
    `;

    turnosFiltradosCache = turnos;
    renderizarTablaPaginada();
    renderizarTablaHistorialPaginada();
  }

  function obtenerTurnosFiltradosActuales() {
    const busqueda = (document.getElementById('inputBusquedaConsultas').value || '').toLowerCase().trim();
    const filtroAsistencia = document.getElementById('selectFiltroAsistencia').value;
    const ordenamiento = document.getElementById('selectOrdenamiento').value;
    let resultado = turnosFiltradosCache.filter(t => {
      const pacienteTxt = (t.paciente || '').toLowerCase();
      const obraTxt = (t.obra || '').toLowerCase();
      const canalTxt = (t.medioSolicitud || '').toLowerCase();
      const coincideTexto = !busqueda || (pacienteTxt.includes(busqueda) || obraTxt.includes(busqueda) || canalTxt.includes(busqueda));
      const est = (t.estado || '').toLowerCase();
      let coincideAsistencia = true;
      if (filtroAsistencia === 'si') coincideAsistencia = (est === 'atendido' || est === 'finalizado' || est === 'confirmado');
      else if (filtroAsistencia === 'no') coincideAsistencia = (est === 'pendiente');
      else if (filtroAsistencia === 'cancelado') coincideAsistencia = (est === 'cancelado');
      return coincideTexto && coincideAsistencia;
    });
    resultado.sort((a, b) => {
      if (ordenamiento === 'fecha_asc') { if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha); return (a.hora || '').localeCompare(b.hora || ''); } 
      else if (ordenamiento === 'fecha_desc') { if (a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha); return (b.hora || '').localeCompare(a.hora || ''); }
      return 0;
    });
    return resultado;
  }

  function obtenerHistorialFiltradosActuales() {
    const busqueda = (document.getElementById('inputBusquedaHistorial').value || '').toLowerCase().trim();
    const filtroAsistencia = document.getElementById('selectFiltroAsistenciaHistorial').value;
    const ordenamiento = document.getElementById('selectOrdenamientoHistorial').value;
    let resultado = turnosHistorialFiltradosCache.filter(t => {
      const pacienteTxt = (t.paciente || '').toLowerCase();
      const obraTxt = (t.obra || '').toLowerCase();
      const canalTxt = (t.medioSolicitud || '').toLowerCase();
      const coincideTexto = !busqueda || (pacienteTxt.includes(busqueda) || obraTxt.includes(busqueda) || canalTxt.includes(busqueda));
      const est = (t.estado || '').toLowerCase();
      let coincideAsistencia = true;
      if (filtroAsistencia === 'si') coincideAsistencia = (est === 'atendido' || est === 'finalizado' || est === 'confirmado');
      else if (filtroAsistencia === 'no') coincideAsistencia = (est === 'pendiente');
      else if (filtroAsistencia === 'cancelado') coincideAsistencia = (est === 'cancelado');
      return coincideTexto && coincideAsistencia;
    });
    resultado.sort((a, b) => {
      if (ordenamiento === 'fecha_asc') { if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha); return (a.hora || '').localeCompare(b.hora || ''); } 
      else if (ordenamiento === 'fecha_desc') { if (a.fecha !== b.fecha) return b.fecha.localeCompare(a.fecha); return (b.hora || '').localeCompare(a.hora || ''); }
      return 0;
    });
    return resultado;
  }

  function renderizarTablaPaginada() {
    const turnosFiltrados = obtenerTurnosFiltradosActuales();
    if(turnosFiltrados.length === 0) {
      document.getElementById('tablaConsultasBox').innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-soft);">No se encontraron registros coincidentes.</p>';
      document.getElementById('paginacionContainer').innerHTML = '';
      return;
    }

    const agrupadosPorFecha = {};
    turnosFiltrados.forEach(t => {
      if(!agrupadosPorFecha[t.fecha]) {
        agrupadosPorFecha[t.fecha] = [];
      }
      agrupadosPorFecha[t.fecha].push(t);
    });

    const diasArray = Object.keys(agrupadosPorFecha).sort((a, b) => {
      const ordenamiento = document.getElementById('selectOrdenamiento').value;
      return ordenamiento === 'fecha_desc' ? b.localeCompare(a) : a.localeCompare(b);
    });

    const pageSize = parseInt(document.getElementById('selectPageSize').value) || 10;
    
    let turnosAcumulados = [];
    diasArray.forEach(fecha => {
      agrupadosPorFecha[fecha].forEach(t => {
        turnosAcumulados.push(t);
      });
    });

    const totalRegistros = turnosAcumulados.length;
    const totalPaginas = Math.ceil(totalRegistros / pageSize) || 1;
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    if (paginaActual < 1) paginaActual = 1;

    const inicio = (paginaActual - 1) * pageSize;
    const fin = inicio + pageSize;
    const turnosPagina = turnosAcumulados.slice(inicio, fin);

    const diasPaginaAgrupados = {};
    turnosPagina.forEach(t => {
      if(!diasPaginaAgrupados[t.fecha]) diasPaginaAgrupados[t.fecha] = [];
      diasPaginaAgrupados[t.fecha].push(t);
    });

    let html = '';
    for(const [fecha, listaTurnos] of Object.entries(diasPaginaAgrupados)) {
      html += `
        <div class="fecha-grupo-card">
          <div class="fecha-grupo-header">
            <span>📅 Fecha: ${formatearFechaDDMMAA(fecha)} (${fecha})</span>
            <span>Turnos mostrados este día: ${listaTurnos.length}</span>
          </div>
          <div style="overflow-x:auto;">
            <table class="data-table" style="margin-top:0;">
              <thead>
                <tr>
                  <th>ID Turno</th>
                  <th>Hora</th>
                  <th>Paciente (Nombre y Apellido)</th>
                  <th>Edad</th>
                  <th>Obra Social</th>
                  <th>Solicitud</th>
                </tr>
              </thead>
              <tbody>
      `;
      listaTurnos.forEach(t => {
        html += `
          <tr>
            <td><strong>#${t.id}</strong></td>
            <td>${t.hora || '-'}</td>
            <td>${t.paciente || t.motivo || '-'}</td>
            <td>${t.edad || '-'}</td>
            <td>${t.obra || 'Particular'}</td>
            <td>${t.medioSolicitud || '-'}</td>
          </tr>
        `;
      });
      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    document.getElementById('tablaConsultasBox').innerHTML = html;

    const inicioMostrado = totalRegistros > 0 ? inicio + 1 : 0;
    const finMostrado = fin > totalRegistros ? totalRegistros : fin;
    document.getElementById('paginacionContainer').innerHTML = `
      <div>Mostrando registros ${inicioMostrado} a ${finMostrado} de ${totalRegistros} en total</div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button onclick="cambiarPagina(-1)" ${paginaActual === 1 ? 'disabled' : ''}>← Anterior</button>
        <span style="font-weight:700; color:var(--text);">Página ${paginaActual} de ${totalPaginas}</span>
        <button onclick="cambiarPagina(1)" ${paginaActual >= totalPaginas ? 'disabled' : ''}>Siguiente →</button>
      </div>`;
  }

  function renderizarTablaHistorialPaginada() {
    const turnosFiltrados = obtenerHistorialFiltradosActuales();
    const pageSize = parseInt(document.getElementById('selectPageSizeHistorial').value) || 10;
    const totalRegistros = turnosFiltrados.length;
    const totalPaginas = Math.ceil(totalRegistros / pageSize) || 1;
    if (paginaActualHistorial > totalPaginas) paginaActualHistorial = totalPaginas;
    if (paginaActualHistorial < 1) paginaActualHistorial = 1;
    const inicio = (paginaActualHistorial - 1) * pageSize;
    const fin = inicio + pageSize;
    const turnosPagina = turnosFiltrados.slice(inicio, fin);
    
    document.getElementById('tablaHistorialBox').innerHTML = generarHTMLTablaLineal(turnosPagina);
    
    const inicioMostrado = totalRegistros > 0 ? inicio + 1 : 0;
    const finMostrado = fin > totalRegistros ? totalRegistros : fin;
    document.getElementById('paginacionHistorialContainer').innerHTML = `
      <div>Mostrando ${inicioMostrado} a ${finMostrado} de ${totalRegistros} registros</div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button onclick="cambiarPaginaHistorial(-1)" ${paginaActualHistorial === 1 ? 'disabled' : ''}>← Anterior</button>
        <span style="font-weight:700; color:var(--text);">Página ${paginaActualHistorial} de ${totalPaginas}</span>
        <button onclick="cambiarPaginaHistorial(1)" ${paginaActualHistorial >= totalPaginas ? 'disabled' : ''}>Siguiente →</button>
      </div>`;
  }

  function generarHTMLTablaLineal(turnos) {
    if(turnos.length === 0) return '<p style="text-align:center; padding:20px; color:var(--text-soft);">No se encontraron registros coincidentes.</p>';
    let html = `<div style="width:100%; overflow:hidden;"><table class="data-table" style="width:100%;">
      <thead><tr><th>Fecha</th><th>Paciente</th><th>Edad</th><th>O.S / part</th><th>Solic.</th><th>Asist.</th></tr></thead><tbody>`;
    turnos.forEach(t => {
      const est = (t.estado || '').toLowerCase();
      let badgeAsist = '';
      if (est === 'atendido' || est === 'finalizado' || est === 'confirmado') badgeAsist = '<span style="background:#d1fae5; color:#065f46; padding:2px 8px; border-radius:12px; font-weight:700; font-size:11px;">SI</span>';
      else if (est === 'cancelado') badgeAsist = '<span style="background:#fef3c7; color:#92400e; padding:2px 8px; border-radius:12px; font-weight:700; font-size:11px;">CANCELADO</span>';
      else badgeAsist = '<span style="background:#fee2e2; color:#991b1b; padding:2px 8px; border-radius:12px; font-weight:700; font-size:11px;">NO</span>';
      html += `<tr><td>${formatearFechaDDMMAA(t.fecha)}</td><td>${t.paciente || t.motivo || '-'}</td><td>${t.edad || '-'}</td><td>${t.obra || 'Particular'}</td><td>${t.medioSolicitud || '-'}</td><td>${badgeAsist}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  }

  function cambiarPagina(delta) { paginaActual += delta; renderizarTablaPaginada(); }
  function cambiarPaginaHistorial(delta) { paginaActualHistorial += delta; renderizarTablaHistorialPaginada(); }
  function cambiarPaginaObras(delta) { paginaActualObras += delta; renderizarTablaObrasPaginada(); }

  function renderReporteObrasYGraficos(turnos, desde, hasta) {
    document.getElementById('tituloObrasHeader').textContent = `Estadísticas: Obra Social / Particular (${desde} al ${hasta})`;

    let totalParticular = 0;
    let totalObrasSociales = 0;
    const conteoSoloObras = {};

    turnos.forEach(t => {
      let osRaw = t.obra ? t.obra.trim() : 'Particular';
      let osCheck = osRaw.toLowerCase();
      if (osCheck.includes('partic') || osCheck === '' || osCheck === '-') {
        totalParticular++;
      } else {
        totalObrasSociales++;
        let osName = osRaw.charAt(0).toUpperCase() + osRaw.slice(1);
        conteoSoloObras[osName] = (conteoSoloObras[osName] || 0) + 1;
      }
    });

    const sortedObras = Object.entries(conteoSoloObras).sort((a, b) => b[1] - a[1]);
    const top4 = sortedObras.slice(0, 4);
    const otrasObrasCount = sortedObras.slice(4).reduce((acc, curr) => acc + curr[1], 0);

    const labelsTopObrasRaw = top4.map(item => item[0]);
    const dataTopObras = top4.map(item => item[1]);
    
    if (otrasObrasCount > 0) {
      labelsTopObrasRaw.push('Otras');
      dataTopObras.push(otrasObrasCount);
    }

    const totalTopObrasSum = dataTopObras.reduce((a, b) => a + b, 0);
    const labelsTopObras = labelsTopObrasRaw.map((lbl, idx) => {
      const val = dataTopObras[idx];
      const p = totalTopObrasSum > 0 ? ((val / totalTopObrasSum) * 100).toFixed(1) : 0;
      return `${lbl} (${p}%)`;
    });

    const totalGeneral = totalObrasSociales + totalParticular;
    const pOS = totalGeneral > 0 ? ((totalObrasSociales / totalGeneral) * 100).toFixed(1) : 0;
    const pPart = totalGeneral > 0 ? ((totalParticular / totalGeneral) * 100).toFixed(1) : 0;

    Chart.defaults.animation = false;

    if (chartTopObrasInstance) chartTopObrasInstance.destroy();
    const ctxTop = document.getElementById('chartTopObras').getContext('2d');
    
    if(totalObrasSociales === 0) {
      chartTopObrasInstance = new Chart(ctxTop, {
        type: 'pie', data: { labels: ['Sin datos'], datasets: [{ data: [1], backgroundColor: ['#e5e7eb'] }] },
        options: { plugins: { title: { display: true, text: 'Top 4 Obras Sociales', font: {size: 12} } } }
      });
    } else {
      chartTopObrasInstance = new Chart(ctxTop, {
        type: 'pie',
        data: {
          labels: labelsTopObras,
          datasets: [{
            data: dataTopObras,
            backgroundColor: ['#dc2626', '#f59e0b', '#3b82f6', '#10b981', '#6b7280']
          }]
        },
        options: {
          plugins: { 
            title: { display: true, text: 'Top 4 Obras Sociales + Otras', font: {size: 12} },
            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
          }
        }
      });
    }

    if (chartOsVsPartInstance) chartOsVsPartInstance.destroy();
    const ctxVs = document.getElementById('chartOsVsPart').getContext('2d');
    
    if(totalObrasSociales === 0 && totalParticular === 0) {
      chartOsVsPartInstance = new Chart(ctxVs, {
        type: 'doughnut', data: { labels: ['Sin datos'], datasets: [{ data: [1], backgroundColor: ['#e5e7eb'] }] },
        options: { plugins: { title: { display: true, text: 'O.S. vs Particular', font: {size: 12} } } }
      });
    } else {
      chartOsVsPartInstance = new Chart(ctxVs, {
        type: 'doughnut',
        data: {
          labels: [`Obras Sociales (${pOS}%)`, `Particular (${pPart}%)`],
          datasets: [{
            data: [totalObrasSociales, totalParticular],
            backgroundColor: ['#3b82f6', '#f43f5e']
          }]
        },
        options: {
          plugins: { 
            title: { display: true, text: 'Obras Sociales vs Particular', font: {size: 12} },
            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
          }
        }
      });
    }

    coberturasCache = [...sortedObras];
    if (totalParticular > 0) {
      coberturasCache.push(['Particular', totalParticular]);
      coberturasCache.sort((a,b) => b[1] - a[1]);
    }

    paginaActualObras = 1;
    renderizarTablaObrasPaginada();
  }

  function renderizarTablaObrasPaginada() {
    const pageSizeSelect = document.getElementById('selectPageSizeObras');
    const pageSize = pageSizeSelect ? parseInt(pageSizeSelect.value) || 5 : 5;
    const totalRegistros = coberturasCache.length;
    const totalPaginas = Math.ceil(totalRegistros / pageSize) || 1;
    
    if (paginaActualObras > totalPaginas) paginaActualObras = totalPaginas;
    if (paginaActualObras < 1) paginaActualObras = 1;
    
    const inicio = (paginaActualObras - 1) * pageSize;
    const fin = inicio + pageSize;
    const coberturasPagina = coberturasCache.slice(inicio, fin);
    const totalGeneral = coberturasCache.reduce((acc, curr) => acc + curr[1], 0);

    let tbody = '';
    coberturasPagina.forEach(item => {
      const porcentajeItem = totalGeneral > 0 ? ((item[1] / totalGeneral) * 100).toFixed(1) : 0;
      tbody += `<tr>
        <td>${item[0]}</td>
        <td style="text-align:center; font-weight:bold;">${item[1]}</td>
        <td style="text-align:center; color:var(--red); font-weight:600;">${porcentajeItem}%</td>
      </tr>`;
    });

    const inicioMostrado = totalRegistros > 0 ? inicio + 1 : 0;
    const finMostrado = fin > totalRegistros ? totalRegistros : fin;

    document.getElementById('reporteObrasInnerContainer').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:700; color:var(--text-soft);">Detalle de Coberturas</span>
        <div class="filter-date-group" style="padding: 2px 8px;">
          <label>Mostrar:</label>
          <select id="selectPageSizeObras" onchange="paginaActualObras=1; renderizarTablaObrasPaginada()">
            <option value="5" ${pageSize===5?'selected':''}>5</option>
            <option value="10" ${pageSize===10?'selected':''}>10</option>
            <option value="20" ${pageSize===20?'selected':''}>20</option>
          </select>
          <span style="font-size:11px; font-weight:700; color:var(--red);">reg.</span>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table" style="margin-top:0;">
          <thead>
            <tr>
              <th>Cobertura</th>
              <th style="text-align:center;">Cantidad</th>
              <th style="text-align:center;">Porcentaje</th>
            </tr>
          </thead>
          <tbody>${tbody || '<tr><td colspan="3" style="text-align:center;">Sin consultas</td></tr>'}</tbody>
        </table>
      </div>
      <div class="pagination-box" id="paginacionObrasContainer">
        <div>Mostrando ${inicioMostrado} a ${finMostrado} de ${totalRegistros} registros</div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button onclick="cambiarPaginaObras(-1)" ${paginaActualObras === 1 ? 'disabled' : ''}>← Anterior</button>
          <span style="font-weight:700; color:var(--text);">Página ${paginaActualObras} de ${totalPaginas}</span>
          <button onclick="cambiarPaginaObras(1)" ${paginaActualObras >= totalPaginas ? 'disabled' : ''}>Siguiente →</button>
        </div>
      </div>
      <div class="total-card-box">
        <span>Total general de consultas</span>
        <strong>${totalGeneral}</strong>
      </div>
    `;
  }

  function enviarPorMailGeneral() {
    const desde = document.getElementById('filtroDesde').value; 
    const hasta = document.getElementById('filtroHasta').value;
    const asunto = encodeURIComponent("Estadísticas Generales - Medi-Turnos");
    let tc = `ESTADÍSTICAS GENERALES\nPeríodo: ${desde} al ${hasta}\n========================\n\n`;
    window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(tc)}`;
  }

  function enviarPorMailListadoConsultas() {
    const desde = document.getElementById('filtroDesde').value; 
    const hasta = document.getElementById('filtroHasta').value;
    const turnosFiltrados = obtenerTurnosFiltradosActuales();
    const asunto = encodeURIComponent(`Listado de Consultas Agrupadas - Medi-Turnos (${desde} al ${hasta})`);

    turnosFiltrados.forEach((t) => {
      textoCuerpo += `🗓️ FECHA: ${formatearFechaDDMMAA(t.fecha)} | ⏰ HORA: ${t.hora || '-'} | ID: #${t.id}\n`;
      textoCuerpo += `👤 PACIENTE: ${t.paciente || t.motivo || '-'}\n`;
      textoCuerpo += `--------------------------------------------------\n`;
    });
    window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCuerpo)}`;
  }

  function enviarPorMailHistorialTurnos() {
    const desde = document.getElementById('filtroDesde').value; 
    const hasta = document.getElementById('filtroHasta').value;
    const turnosFiltrados = obtenerHistorialFiltradosActuales();
    const asunto = encodeURIComponent(`Historial de Turnos - Medi-Turnos (${desde} al ${hasta})`);
    let textoCuerpo = `HISTORIAL DE TURNOS - MEDI-TURNOS\nPeríodo: ${desde} al ${hasta} | Total: ${turnosFiltrados.length} registros\n==================================================\n\n`;
    turnosFiltrados.forEach((t) => {
      let estTxt = 'NO'; const est = (t.estado || '').toLowerCase();
      if (est === 'atendido' || est === 'finalizado' || est === 'confirmado') estTxt = 'SÍ'; else if (est === 'cancelado') estTxt = 'CANCELADO';
      textoCuerpo += `🗓️ FECHA: ${formatearFechaDDMMAA(t.fecha)} | 🏥 O.S: ${t.obra || 'Particular'}\n`;
      textoCuerpo += `👤 PACIENTE: ${t.paciente || t.motivo || '-'}\n`;
      textoCuerpo += `--------------------------------------------------\n`;
    });
    window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCuerpo)}`;
  }

  function enviarPorMailObras() {
    const desde = document.getElementById('filtroDesde').value;
    const hasta = document.getElementById('filtroHasta').value;
    let turnos = window.listaTurnosGeneral.filter(t => t.fecha >= desde && t.fecha <= hasta);

    const conteoObras = {};
    turnos.forEach(t => {
      let os = t.obra || 'Particular';
      conteoObras[os] = (conteoObras[os] || 0) + 1;
    });

    const asunto = encodeURIComponent(`Consultas por Obra Social - Medi-Turnos (${desde} al ${hasta})`);
    let textoCuerpo = `CONSULTAS POR OBRA SOCIAL / PARTICULAR\nPeríodo: ${desde} al ${hasta}\n==================================================\n\n`;
    for (let os in conteoObras) {
      textoCuerpo += `🏥 ${os}: ${conteoObras[os]} consultas\n`;
    }
    window.location.href = `mailto:?subject=${asunto}&body=${encodeURIComponent(textoCuerpo)}`;
  }
