<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área Profesional | Medi-Turnos</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="login-page">
<header class="topbar"><div class="brand"><img src="assets/Logo-MediTurnos.png" alt="Medi-Turnos"><span>Área Profesional</span></div><div class="help">◯ Ayuda</div></header>
<main class="login-main">
<section class="login-visual">
<h1>Acceso profesional</h1><h3>Área Profesional</h3><p>Espacio de trabajo para especialistas: agenda, pacientes, consultas y carga de información clínica.</p>
<div class="role-boxes"><div class="role-box prof">Profesional</div><div class="role-box admin">Agenda y consultas</div></div>
</section>
<section class="login-card"><div class="login-box">
<img class="login-logo" src="assets/Logo-MediTurnos.png" alt="Medi-Turnos">
<h2>BIENVENIDO</h2><p class="sub">Ingresá tus credenciales para continuar</p>
<form class="login-form" action="profesional-dashboard.html">
<label>Usuario</label><input required placeholder="Ingrese su usuario">
<label>Contraseña</label><input required type="password" placeholder="Ingrese su contraseña">
<label>Perfil</label><select><option>Acceso profesional</option></select>
<button class="login-btn">Ingresar</button>
<button class="login-link" type="button">¿Olvidaste tu contraseña?</button>
<div class="login-footer">Sistema seguro y confidencial</div>
</form></div></section>
</main></div></body></html>
