<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medi-Turnos | Portal del Paciente</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(13, 59, 36, 0.75), rgba(20, 92, 58, 0.85)),
                url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat fixed;
    padding: 20px;
  }

  .auth-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 440px;
    overflow: hidden;
    border: 1px solid #b7d4c4;
  }

  .auth-header {
    background: #1a7a4c;
    color: white;
    padding: 28px 24px 20px;
    text-align: center;
  }

  .auth-header img {
    height: 48px;
    background: white;
    border-radius: 10px;
    padding: 6px 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .auth-header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .auth-header p {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 2px;
  }

  .auth-tabs {
    display: flex;
    background: #f0faf4;
    border-bottom: 1px solid #b7d4c4;
  }

  .tab-btn {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    font-size: 13px;
    font-weight: 700;
    color: #5a6b60;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  .tab-btn.active {
    color: #1a7a4c;
    border-bottom-color: #1a7a4c;
    background: #ffffff;
  }

  .auth-body {
    padding: 24px;
  }

  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #1a2e22;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 0.4px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    font-size: 16px;
    color: #1a7a4c;
    pointer-events: none;
    z-index: 2;
  }

  .input-wrapper input,
  .input-wrapper select {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1.5px solid #b7d4c4;
    border-radius: 10px;
    font-size: 14px;
    background: #fafffe;
    color: #1a2e22;
    transition: border-color 0.2s, background-color 0.2s;
  }

  .input-wrapper input:focus,
  .input-wrapper select:focus {
    outline: none;
    border-color: #1a7a4c;
    background: #ffffff;
  }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #1a7a4c;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 12px rgba(26, 122, 76, 0.2);
    transition: all 0.2s;
  }

  .btn-submit:hover {
    background: #145c3a;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(26, 122, 76, 0.3);
  }

  .msg-box {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }

  .msg-box.error {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    display: block;
  }

  .msg-box.success {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #6ee7b7;
    display: block;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #1a7a4c;
    text-decoration: none;
    font-weight: 600;
  }

  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <img src="assets/Logo-MediTurnos.png" alt="Medi-Turnos" onerror="this.style.display='none'">
    <h1>Medi-Turnos</h1>
    <p>Portal de Acceso para Pacientes</p>
  </div>

  <div class="auth-tabs">
    <button class="tab-btn active" id="btnTabLogin" onclick="switchTab('login')">Ingresar</button>
    <button class="tab-btn" id="btnTabReg" onclick="switchTab('registro')">Crear Cuenta Paciente</button>
  </div>

  <div class="auth-body">
    <div id="msgAlert" class="msg-box"></div>

    <!-- FORMULARIO INICIAR SESIÓN -->
    <form id="formLogin">
      <div class="input-group">
        <label>Usuario o DNI</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="loginUsuario" placeholder="Ej: juan.perez o 32456789" required>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Acceder al Portal</button>
    </form>

    <!-- FORMULARIO REGISTRO NUEVO PACIENTE -->
    <form id="formRegistro" style="display:none;">
      <div class="input-group">
        <label>Nombre Completo</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="regNombre" placeholder="Ej: Juan Pérez" required>
        </div>
      </div>

      <div class="input-group">
        <label>DNI / Documento</label>
        <div class="input-wrapper">
          <span class="input-icon">🪪</span>
          <input type="text" id="regDni" placeholder="Ej: 32456789" required>
        </div>
      </div>

      <div class="input-group">
        <label>Obra Social / Cobertura</label>
        <div class="input-wrapper">
          <span class="input-icon">🏥</span>
          <select id="regObra" required>
            <option value="Particular">Particular</option>
            <option value="OSDE">OSDE</option>
            <option value="Swiss Medical">Swiss Medical</option>
            <option value="Galeno">Galeno</option>
            <option value="Medicus">Medicus</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label>Teléfono de Contacto</label>
        <div class="input-wrapper">
          <span class="input-icon">📞</span>
          <input type="tel" id="regTel" placeholder="Ej: 11 5555-1234" required>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" id="regPass" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Registrarme y Pedir Turno</button>
    </form>

    <a href="index.html" class="back-link">← Volver al Menú Principal</a>
  </div>
</div>

<script>
  function switchTab(type) {
    const fLogin = document.getElementById('formLogin');
    const fReg = document.getElementById('formRegistro');
    const tLogin = document.getElementById('btnTabLogin');
    const tReg = document.getElementById('btnTabReg');
    ocultarMensaje();

    if (type === 'login') {
      fLogin.style.display = 'block';
      fReg.style.display = 'none';
      tLogin.classList.add('active');
      tReg.classList.remove('active');
    } else {
      fLogin.style.display = 'none';
      fReg.style.display = 'block';
      tReg.classList.add('active');
      tLogin.classList.remove('active');
    }
  }

  function mostrarMensaje(text, type) {
    const box = document.getElementById('msgAlert');
    box.textContent = text;
    box.className = 'msg-box ' + type;
    box.style.display = 'block';
  }

  function ocultarMensaje() {
    const box = document.getElementById('msgAlert');
    box.className = 'msg-box';
    box.style.display = 'none';
  }

  // EVENTO: INICIAR SESIÓN
  document.getElementById('formLogin').addEventListener('submit', async function(e) {
    e.preventDefault();
    ocultarMensaje();

    const usuario = document.getElementById('loginUsuario').value.trim();
    const password = document.getElementById('loginPass').value;

    try {
      const res = await fetch('http://localhost:3000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password, rol: 'paciente' })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('usuario_activo', JSON.stringify(data.usuario));
        mostrarMensaje('¡Bienvenido/a! Redirigiendo...', 'success');
        setTimeout(() => window.location.href = 'pacientes.html', 800);
      } else {
        mostrarMensaje(data.mensaje || 'Credenciales incorrectas', 'error');
      }
    } catch (err) {
      if ((usuario === 'paciente' || usuario === '32456789') && password === '1234') {
        localStorage.setItem('usuario_activo', JSON.stringify({ nombre: 'Juan Pérez', dni: '32456789', obra: 'OSDE', rol: 'paciente' }));
        mostrarMensaje('¡Bienvenido! (Modo Local)', 'success');
        setTimeout(() => window.location.href = 'pacientes.html', 800);
      } else {
        mostrarMensaje('Error de conexión con el backend en http://localhost:3000', 'error');
      }
    }
  });

  // EVENTO: REGISTRO DE PACIENTE NUEVO
  document.getElementById('formRegistro').addEventListener('submit', async function(e) {
    e.preventDefault();
    ocultarMensaje();

    const nombre = document.getElementById('regNombre').value.trim();
    const dni = document.getElementById('regDni').value.trim();
    const obra = document.getElementById('regObra').value;
    const telefono = document.getElementById('regTel').value.trim();

    try {
     const res = await fetch('http://127.0.0.1:3000/api/pacientes', {   
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, dni, obra, telefono })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('usuario_activo', JSON.stringify({ nombre, dni, obra, telefono, rol: 'paciente' }));
        mostrarMensaje('¡Cuenta creada con éxito! Redirigiendo...', 'success');
        setTimeout(() => {
          window.location.href = 'pacientes.html';
        }, 1000);
      } else {
        mostrarMensaje(data.mensaje || 'No se pudieron guardar los datos.', 'error');
      }
    } catch (err) {
      console.error('Error de red:', err);
      mostrarMensaje('No se pudo conectar con el servidor backend en http://localhost:3000', 'error');
    }
  });
</script>
</body>
</html>
