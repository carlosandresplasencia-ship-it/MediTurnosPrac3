<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Medi-Turnos</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="login-page">
  <header class="topbar">
    <div class="brand">
      <img src="assets/Logo-MediTurnos.png" alt="Medi-Turnos">
      <span>Administración</span>
    </div>
    <div class="help">◯ Ayuda</div>
  </header>
  
  <main class="login-main">
    <section class="login-visual">
      <h1>Acceso administrativo</h1>
      <h3>Administración</h3>
      <p>Gestión integral del consultorio dermatológico, usuarios, configuraciones, pacientes, turnos y profesionales.</p>
      <div class="role-boxes">
        <div class="role-box master">Master</div>
        <div class="role-box admin">Administrador</div>
        <div class="role-box prof">Profesional</div>
      </div>
    </section>

    <section class="login-card">
      <div class="login-box">
        <img class="login-logo" src="assets/Logo-MediTurnos.png" alt="Medi-Turnos">
        <h2>BIENVENIDO</h2>
        <p class="sub">Ingresá tus credenciales para continuar</p>
        
        <form class="login-form">
          <label>Usuario</label>
          <input required placeholder="Ingrese su usuario">
          
          <label>Contraseña</label>
          <input required type="password" placeholder="Ingrese su contraseña">
          
          <label>Perfil</label>
          <select>
            <option>Acceso administrativo</option>
          </select>
          
          <button type="submit" class="login-btn">Ingresar</button>
          <button class="login-link" type="button">¿Olvidaste tu contraseña?</button>
          <div class="login-footer">Sistema seguro y confidencial</div>
        </form>
      </div>
    </section>
  </main>
</div>

<script>
  const loginForm = document.querySelector('.login-form');
  
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const inputs = loginForm.querySelectorAll('input');
    const usuario = inputs[0].value.trim();
    const password = inputs[1].value.trim();
    
    try {
      const respuesta = await fetch('http://localhost:3000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });
      
      const data = await respuesta.json();
      
      if (respuesta.ok && data.autorizado) {
        alert('¡Acceso autorizado con éxito!');
        window.location.href = data.redirect;
      } else {
        alert(data.mensaje || 'Credenciales incorrectas');
      }
    } catch (error) {
      console.error('Error de conexión:', error);
      alert('No se pudo conectar con el servidor backend. Asegurate de que esté corriendo.');
    }
  });
</script>
</body>
</html>
