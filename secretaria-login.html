<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medi-Turnos | Acceso Secretaría</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(117, 4, 25, 0.8), rgba(185, 28, 28, 0.85)),
                url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat fixed;
    padding: 20px;
  }
  .auth-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    border: 1px solid #f5c2c2;
  }
  .auth-header {
    background: #750419;
    color: white;
    padding: 28px 24px 20px;
    text-align: center;
  }
  .auth-header .logo {
    width: 56px; height: 56px;
    background: white;
    color: #750419;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 10px;
  }
  .auth-header h1 { font-size: 22px; font-weight: 800; }
  .auth-header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .auth-body { padding: 28px 24px; }
  .input-group { margin-bottom: 16px; }
  .input-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #1a1a1a;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 0.4px;
  }
  .input-wrapper { position: relative; }
  .input-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: #750419;
  }
  .input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1.5px solid #f5c2c2;
    border-radius: 10px;
    font-size: 14px;
    background: #fff5f5;
    color: #1a1a1a;
  }
  .input-wrapper input:focus {
    outline: none;
    border-color: #750419;
    background: #fff;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #750419;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .btn-submit:hover { background: #a43838; }
  .msg-box {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .msg-box.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
  .msg-box.success { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #750419;
    text-decoration: none;
    font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }
  .hint {
    font-size: 12px;
    color: #6b5a5a;
    text-align: center;
    margin-top: 14px;
    background: #fff5f5;
    padding: 8px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-header">
    <div class="logo">MT</div>
    <h1>Medi-Turnos</h1>
    <p>Área Administrativa · Secretaría</p>
  </div>
  <div class="auth-body">
    <div id="msgAlert" class="msg-box"></div>
    <form id="formLogin">
      <div class="input-group">
        <label>Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">📋</span>
          <input type="text" id="loginUsuario" placeholder="secretaria" required value="secretaria">
        </div>
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPass" placeholder="••••••••" required value="1234">
        </div>
      </div>
      <button type="submit" class="btn-submit">Ingresar a Secretaría</button>
    </form>
    <div class="hint">Usuario: <b>secretaria</b> &nbsp;·&nbsp; Clave: <b>1234</b></div>
    <a href="index.html" class="back-link">← Volver al Menú Principal</a>
  </div>
</div>
<script>
  document.getElementById('formLogin').addEventListener('submit', async function(e) {
    e.preventDefault();
    const box = document.getElementById('msgAlert');
    box.style.display = 'none';

    const usuario = document.getElementById('loginUsuario').value.trim();
    const password = document.getElementById('loginPass').value;

    try {
      const res = await fetch('http://localhost:3000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password, rol: 'secretaria' })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('usuario_activo', JSON.stringify(data.usuario));
        box.textContent = '¡Bienvenida! Redirigiendo...';
        box.className = 'msg-box success';
        setTimeout(() => window.location.href = 'secretaria.html', 700);
      } else {
        box.textContent = data.mensaje || 'Credenciales incorrectas';
        box.className = 'msg-box error';
      }
    } catch (err) {
      if (usuario === 'secretaria' && password === '1234') {
        localStorage.setItem('usuario_activo', JSON.stringify({
          nombre: 'Secretaría',
          rol: 'secretaria'
        }));
        box.textContent = '¡Bienvenida! (Modo Local)';
        box.className = 'msg-box success';
        setTimeout(() => window.location.href = 'secretaria.html', 700);
      } else {
        box.textContent = 'Error de conexión. ¿Está corriendo el backend? (npm start)';
        box.className = 'msg-box error';
      }
    }
  });
</script>
</body>
</html>
